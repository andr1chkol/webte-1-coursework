<!doctype html>
<html lang="sk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Malý obchod</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
<main>
    <h1>Malý obchod</h1>

    <p id="status">Produkty sa načítavajú…</p>
    <button id="reload" type="button">Načítať produkty</button>

    <ul id="products" class="products">
    </ul>

    <section class="cart">
        <h2>Košík</h2>
        <p>Položiek: <span id="cart-count">0</span>, spolu <span id="cart-total">0.00</span> €</p>
        <button id="discount" type="button">Zľava 10 %</button>
    </section>
</main>
</body>
</html>
